name: Homepage layout
on:
  pull_request:
    paths:
      - 'wp-content/themes/daniella-somers/**'
      - 'tests/homepage-layout*'
      - '.github/workflows/homepage-layout.yml'
  workflow_dispatch:
jobs:
  browser-layout:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser test dependency
        run: npm install --no-save --no-package-lock playwright@1.58.2
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Test responsive homepage layout
        run: node --test tests/homepage-layout.spec.cjs
