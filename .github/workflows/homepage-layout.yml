name: Production front page
on:
  pull_request:
    paths:
      - 'index.html'
      - 'assets/**'
      - 'CNAME'
      - 'wp-content/themes/daniella-somers/**'
      - 'tests/**'
      - '.github/workflows/homepage-layout.yml'
      - '.github/workflows/pages.yml'
  workflow_dispatch:
jobs:
  browser-layout:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser test dependency
        run: npm install --no-save --no-package-lock playwright@1.58.2
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Check PHP syntax
        run: docker run --rm -v "$PWD/wp-content/themes/daniella-somers:/theme:ro" wordpress:php8.3-fpm sh -c 'find /theme -name "*.php" -type f -exec php -l {} \;'
      - name: Test theme contracts and layout parity
        run: node --test tests/wordpress-storage.spec.cjs tests/home-media.spec.cjs tests/homepage-layout.spec.cjs tests/editor-layout.spec.cjs tests/live-homepage.spec.cjs
      - name: Test proposed CSS against the real saved WordPress Front Page
        env:
          HOMEPAGE_URL: https://daniellasomerscounselling.co.uk/
        run: node --test tests/live-homepage.spec.cjs
      - name: Test final GitHub Pages front page
        run: node --test tests/pages-site.spec.cjs
