name: Production front page
on:
  pull_request:
    paths:
      - 'index.html'
      - 'assets/**'
      - 'CNAME'
      - 'tests/**'
      - '.github/workflows/homepage-layout.yml'
      - '.github/workflows/pages.yml'
  workflow_dispatch:
jobs:
  browser-layout:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser test dependency
        run: npm install --no-save --no-package-lock playwright@1.58.2
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Test final GitHub Pages front page
        run: node --test tests/pages-site.spec.cjs
