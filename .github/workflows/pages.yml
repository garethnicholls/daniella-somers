name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Prepare public site
        run: |
          rm -rf _site
          mkdir -p _site/assets _site/option-b _site/option-c
          cp index.html _site/index.html
          cp option-b/index.html _site/option-b/index.html
          cp option-c/index.html _site/option-c/index.html
          cp portrait.css _site/portrait.css
          find _site -type f -exec sed -i 's/Daniella Sommers/Daniella Somers/g; s/daniellasommers/daniellasomers/g' {} +
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
