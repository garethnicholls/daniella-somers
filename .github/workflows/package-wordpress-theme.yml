name: Package WordPress Theme

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'wp-content/themes/daniella-somers/**'
      - '.github/workflows/package-wordpress-theme.yml'

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate theme files
        run: |
          set -euo pipefail
          test -f wp-content/themes/daniella-somers/style.css
          test -f wp-content/themes/daniella-somers/theme.json
          test -d wp-content/themes/daniella-somers/templates
          test -d wp-content/themes/daniella-somers/parts

      - name: Build installable ZIP
        run: |
          set -euo pipefail
          OUTPUT_DIR="$GITHUB_WORKSPACE/dist"
          OUTPUT_FILE="$OUTPUT_DIR/daniella-somers.zip"
          mkdir -p "$OUTPUT_DIR"
          cd "$GITHUB_WORKSPACE/wp-content/themes"
          zip -r "$OUTPUT_FILE" daniella-somers \
            -x '*/.DS_Store' '*.log' '*.env' '.env*'
          test -s "$OUTPUT_FILE"
          unzip -l "$OUTPUT_FILE" | grep -q 'daniella-somers/style.css'

      - name: Upload theme artifact
        uses: actions/upload-artifact@v4
        with:
          name: daniella-somers-theme
          path: dist/daniella-somers.zip
          if-no-files-found: error
          retention-days: 7
